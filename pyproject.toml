[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-mri-methods"
version = "0.1.0"
description = "Knee MRI finding classification, anatomy segmentation and ACL/MCL attachment localization"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy", "scipy", "torch>=2.3", "pandas", "pydicom", "transformers", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["knee_mri*"]
